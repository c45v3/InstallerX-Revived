name: Preview Release

on:
  push:
    branches: [ "main" ]
    # Build only when application code or build inputs change.
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'app-process/src/**'
      - 'app-process/build.gradle.kts'
      - 'hidden-api/src/**'
      - 'hidden-api/build.gradle.kts'
      - 'baselineprofile/src/**'
      - 'baselineprofile/build.gradle.kts'
      - 'build-plugins/src/**'
      - 'build-plugins/build.gradle.kts'
      - 'build-plugins/settings.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/auto-preview-release.yml'

jobs:
  build_and_prerelease:
    name: Build and Publish Preview
    # Skip preview release for version bumps or explicitly skipped commits
    if: |
      !startsWith(github.event.head_commit.message, 'chore: bump version') &&
      !startsWith(github.event.head_commit.message, 'chore(release)') &&
      !contains(github.event.head_commit.message, '[skip preview]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get commit short SHA & Date
        id: vars
        run: |
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          echo "YY_MM=$(date +'%y.%m')" >> $GITHUB_OUTPUT

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Accept the terms of use to suppress the caching licensing warning
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          # Main branch builds are allowed to update the cache
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Configure system module signing key
        env:
          SYSTEM_SIGNING_KEY_STORE_BASE64: ${{ secrets.SYSTEM_SIGNING_KEY_STORE_BASE64 }}
          SYSTEM_SIGNING_STORE_PASSWORD: ${{ secrets.SYSTEM_SIGNING_STORE_PASSWORD }}
          SYSTEM_SIGNING_KEY_ALIAS: ${{ secrets.SYSTEM_SIGNING_KEY_ALIAS }}
          SYSTEM_SIGNING_KEY_PASSWORD: ${{ secrets.SYSTEM_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "${SYSTEM_SIGNING_STORE_PASSWORD:-}" ] || [ -z "${SYSTEM_SIGNING_KEY_STORE_BASE64:-}" ] || [ -z "${SYSTEM_SIGNING_KEY_PASSWORD:-}" ] || [ -z "${SYSTEM_SIGNING_KEY_ALIAS:-}" ]; then
            echo "::error::Missing SYSTEM_SIGNING_* secrets"
            exit 1
          fi
          mkdir -p keystore
          echo "${SYSTEM_SIGNING_KEY_STORE_BASE64}" | base64 --decode > keystore/system-installer.jks
          echo "storeFile=keystore/system-installer.jks" > keystore.properties
          echo "keyAlias=${SYSTEM_SIGNING_KEY_ALIAS}" >> keystore.properties
          echo "keyPassword=${SYSTEM_SIGNING_KEY_PASSWORD}" >> keystore.properties
          echo "storePassword=${SYSTEM_SIGNING_STORE_PASSWORD}" >> keystore.properties
          chmod 600 keystore.properties keystore/system-installer.jks

      - name: Build release APKs (publish Stable flavor)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleStableRelease

      - name: Build system APK and package module
        id: module
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          NORMAL_APK="$(find app/build/outputs/apk -type f -ipath '*/stable/release/*.apk' -print -quit)"
          test -n "$NORMAL_APK"
          VERSION_TAG="${{ steps.vars.outputs.YY_MM }}.${{ steps.vars.outputs.SHORT_SHA }}"
          NORMAL_OUT="dist/InstallerX-Revived-online-${VERSION_TAG}.apk"
          cp "$NORMAL_APK" "$NORMAL_OUT"
          ./gradlew assembleStableRelease -PAPP_ID=com.android.packageinstaller
          SYSTEM_APK="$(find app/build/outputs/apk -type f -ipath '*/stable/release/*.apk' -print -quit)"
          test -n "$SYSTEM_APK"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$AAPT" && test -n "$APKSIGNER"
          BADGING="$("$AAPT" dump badging "$SYSTEM_APK" | sed -n '1p')"
          echo "$BADGING" | grep -q "name='com.android.packageinstaller'"
          VERSION_CODE="$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]
          "$APKSIGNER" verify --print-certs "$NORMAL_OUT"
          "$APKSIGNER" verify --print-certs "$SYSTEM_APK"
          MODULE_DIR="$(mktemp -d)"
          mkdir -p "$MODULE_DIR/system/priv-app/PackageInstaller"
          cp "$SYSTEM_APK" "$MODULE_DIR/system/priv-app/PackageInstaller/PackageInstaller.apk"
          printf 'id=com.android.packageinstaller\nname=InstallerX Revived System\nversion=%s\nversionCode=%s\nauthor=c45v3\ndescription=InstallerX Revived stable flavor as system PackageInstaller\n' "$VERSION_TAG" "$VERSION_CODE" > "$MODULE_DIR/module.prop"
          printf '#!/system/bin/sh\nam start -n com.android.packageinstaller/com.rosan.installer.ui.activity.SettingsActivity\n' > "$MODULE_DIR/action.sh"
          chmod 755 "$MODULE_DIR/action.sh"
          MODULE_OUT="dist/InstallerX-Revived-System-AOSP-${VERSION_TAG}.zip"
          (cd "$MODULE_DIR" && zip -q -9 -r "$GITHUB_WORKSPACE/$MODULE_OUT" .)
          echo "apk=$NORMAL_OUT" >> "$GITHUB_OUTPUT"
          echo "module_zip=$MODULE_OUT" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
      - name: Delete old preview release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use regex to find tags ending with a hex hash of 7 or more characters
          # Stable tags like 26.03 or 26.03.01 will not match this regex
          LATEST_TAG=$(git tag --list --sort=-creatordate | grep -E '^[0-9]+\.[0-9]+\.[a-f0-9]{7,}$' | head -n 1)
          if [[ -n "$LATEST_TAG" ]]; then
            gh release delete "$LATEST_TAG" --yes || echo "No previous preview release found to delete."
            git push origin --delete "$LATEST_TAG" || echo "No previous preview tag found to delete."
          else
            echo "No preview tag to delete."
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # Match pure number stable tags, ignoring those with hex hashes
          PREV_TAG=$(git tag --list | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -Vr | head -n 1)
          CURR_TAG="${{ steps.module.outputs.version_tag }}"

          if [ -z "$PREV_TAG" ]; then
            LOG_RANGE=""
          else
            LOG_RANGE="$PREV_TAG..HEAD"
          fi

          CHANGELOG_LIST=$(git log $LOG_RANGE --pretty=format:"- %s (%an)" | grep -v '^-\s*Merge' | head -n 5)
          CHANGELOG_COUNT=$(git log $LOG_RANGE --pretty=format:"- %s (%an)" | grep -v '^-\s*Merge' | wc -l)
          
          CHANGELOG_BODY_OUTPUT=""
          if [ -z "$CHANGELOG_LIST" ]; then
            CHANGELOG_BODY_OUTPUT="No changes since the last stable release."
          else
            CHANGELOG_BODY_OUTPUT="$CHANGELOG_LIST"
          fi

          CHANGELOG_LINK_OUTPUT=""
          if [ "$CHANGELOG_COUNT" -gt 5 ]; then
            if [ -z "$PREV_TAG" ]; then
              COMPARE_URL="https://github.com/${{ github.repository }}/commits/main"
            else
              COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURR_TAG}"
            fi
            CHANGELOG_LINK_OUTPUT="\n\n**Full Changelog:** [\`${PREV_TAG}...${CURR_TAG}\`]($COMPARE_URL)"
          fi
          
          {
            echo "changelog_body<<EOF"
            echo -e "$CHANGELOG_BODY_OUTPUT"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "changelog_full_link<<EOF"
            echo -e "$CHANGELOG_LINK_OUTPUT"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "--- Generated Changelog for Release Body ---"
          echo -e "${CHANGELOG_BODY_OUTPUT}${CHANGELOG_LINK_OUTPUT}"

      - name: Create Latest Preview Release
        uses: softprops/action-gh-release@v3
        with:
          name: "InstallerX Revived Preview (${{ steps.vars.outputs.SHORT_SHA }})"
          tag_name: "${{ steps.module.outputs.version_tag }}"
          target_commitish: ${{ github.sha }}
          body: |
            ## 这是自动构建的最新测试版。
            - **这是一个预发布版本，并非为生产环境准备就绪。**
            - 我们非常鼓励您分享您的看法！
            
            ## This is an automatically built latest Preview release.
            - **This is a pre-release version and is not intended for production use.**
            - We appreciate any feedback!
            
            **更新日志（Changelog）:**
            ${{ steps.changelog.outputs.changelog_body }}${{ steps.changelog.outputs.changelog_full_link }}
          prerelease: true
          files: |
            ${{ steps.module.outputs.apk }}
            ${{ steps.module.outputs.module_zip }}

      - name: Upload mapping
        uses: actions/upload-artifact@v7
        with:
          name: mapping
          path: app/build/outputs/apk/**/release/mapping.txt
          retention-days: 15
          archive: false
